# only manual
trigger: none
pr: none

parameters:
  - name: 'DEV'
    displayName: 'Run on DEV environment'
    type: boolean
    default: True
    values:
      - False
      - True
  - name: 'UAT'
    displayName: 'Run on UAT environment'
    type: boolean
    default: True
    values:
      - False
      - True
  - name: 'PROD'
    displayName: 'Run on PROD environment'
    type: boolean
    default: True
    values:
      - False
      - True


pool:
  vmImage: 'ubuntu-latest'

resources:
  repositories:
    - repository: terraform
      type: github
      name: pagopa/azure-pipeline-templates
      ref: refs/multiple-kubeconfig
      endpoint: "io-azure-devops-github-ro"


variables:
  TIME_OUT: 120
  WORKINGDIR: "."


stages:
  - stage: DEV
    displayName: DEV apply all folders
    dependsOn: []
    condition: and(succeeded(), eq(${{parameters.DEV}}, true))
    pool:
      name: '$(TF_POOL_NAME_DEV)'
    jobs:
      - job: apply_all_folders
        displayName: Apply all folders in target env
        strategy:
          parallel: 1
        timeoutInMinutes: ${{ variables.TIME_OUT }}
        condition: succeeded()
        steps:
          - checkout: self
            workspaceRepo: true
          - template: templates/azure-kubeconfig-generator/template.yaml@terraform
            parameters:
              AZURE_SERVICE_CONNECTION_NAME: '$(TF_AZURE_SERVICE_CONNECTION_APPLY_NAME_DEV)'
              WORKINGDIR: '$(Agent.BuildDirectory)'
              AKS_NAME: '$(TF_AKS_DEV_NAME)'
              AKS_API_SERVER_URL: '$(TF_DEV_AKS_APISERVER_URL)'
              AKS_AZURE_DEVOPS_SA_CA_CRT: '$(TF_DEV_AKS_AZURE_DEVOPS_SA_CACRT)'
              AKS_AZURE_DEVOPS_SA_TOKEN: '$(TF_DEV_AKS_AZURE_DEVOPS_SA_TOKEN)'
              OUTPUT_CTX_NAME: 'weu'
          - template: templates/azure-kubeconfig-generator/template.yaml@terraform
            parameters:
              AZURE_SERVICE_CONNECTION_NAME: '$(TF_AZURE_SERVICE_CONNECTION_APPLY_NAME_DEV)'
              WORKINGDIR: '$(Agent.BuildDirectory)'
              AKS_NAME: '$(TF_SECOND_AKS_DEV_NAME)'
              AKS_API_SERVER_URL: '$(TF_SECOND_DEV_AKS_APISERVER_URL)'
              AKS_AZURE_DEVOPS_SA_CA_CRT: '$(TF_SECOND_DEV_AKS_AZURE_DEVOPS_SA_CACRT)'
              AKS_AZURE_DEVOPS_SA_TOKEN: '$(TF_SECOND_DEV_AKS_AZURE_DEVOPS_SA_TOKEN)'
              OUTPUT_CTX_NAME: 'itn'
          - task: AzureCLI@2
            displayName: "debug"
            inputs:
              azureSubscription: '$(TF_AZURE_SERVICE_CONNECTION_APPLY_NAME_DEV)'
              addSpnToEnvironment: true
              scriptLocation: inlineScript
              scriptType: bash
              inlineScript: |
                set -e
                echo "$(pwd)"
                ls -la

          - task: AzureCLI@2
            displayName: "Apply all folders"
            inputs:
              azureSubscription: '$(TF_AZURE_SERVICE_CONNECTION_APPLY_NAME_DEV)'
              addSpnToEnvironment: true
              scriptLocation: inlineScript
              scriptType: bash
              inlineScript: |
                set -e
                echo "[INFO] Terraform setup variables"
                export ARM_CLIENT_ID=${servicePrincipalId}
                export ARM_SUBSCRIPTION_ID=$(az account show --query id --output tsv)
                export ARM_TENANT_ID=${tenantId}
                if [ -n "${idToken}" ]; then
                  export ARM_USE_OIDC=true
                  export ARM_OIDC_TOKEN=${idToken}
                elif [ -n "${servicePrincipalKey}" ]; then
                  export ARM_CLIENT_SECRET=${servicePrincipalKey}
                else
                  echo "[ERROR] Missing Azure service connection credentials in AzureCLI environment."
                  exit 1
                fi
                python3 -u .devops/templates/tf-apply-all.py dev $(pwd)

