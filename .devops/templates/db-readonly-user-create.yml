parameters:
  - name: DATABASE_NAME
    displayName: 'Database name'
    type: string
  - name: DB_HOST
    displayName: 'DB hostname'
    type: string
  - name: USERNAME
    displayName: 'Username to be created'
    type: string
  - name: PASSWORD
    displayName: 'Password associated to the new user'
    type: string
  - name: KEY_VAULT_NAME
    displayName: 'Key vault name'
    type: string
  - name: ADMIN_LOGIN_KEY
    displayName: 'Admin login key vault secret name'
    type: string
  - name: ADMIN_PWD_KEY
    displayName: 'Admin password key vault secret name'
    type: string
  - name: SERVICE_CONNECTION
    displayName: 'Azure service connection name'
    type: string

steps:
  - task: AzureKeyVault@2
    displayName: "Get secrets"
    inputs:
      azureSubscription: ${{ parameters.SERVICE_CONNECTION }}
      keyVaultName: ${{ parameters.KEY_VAULT_NAME }}
      secretsFilter: '${{parameters.ADMIN_LOGIN_KEY}},${{parameters.ADMIN_PWD_KEY}}'
  - task: AzureCLI@2
    displayName: "Create db read user"
    inputs:
      azureSubscription: ${{ parameters.SERVICE_CONNECTION }}
      scriptLocation: inlineScript
      scriptType: bash
      inlineScript: |
        install_rdbms_connect () {
          # The extension installs system packages through apt: on self-hosted agents
          # unattended-upgrades can hold the dpkg lock right after boot, so wait and retry.
          az config set extension.use_dynamic_install=yes_without_prompt
          for attempt in 1 2 3 4 5 6; do
            # bounded wait (max ~2 min): never block the job forever on a stuck upgrade
            waited=0
            # NB: "unattended-upgrade-shutdown" is a permanent daemon, so match only the real upgrade run
            while pgrep -f "bin/unattended-upgrade( |$)" > /dev/null || pgrep -x apt-get > /dev/null || pgrep -x dpkg > /dev/null; do
              if [ "$waited" -ge 120 ]; then
                echo "apt/dpkg still busy after ${waited}s, trying anyway. Holders:"
                ps -eo pid,etime,args | grep -E "bin/unattended-upgrade( |$)|apt-get|dpkg" | grep -v grep || true
                break
              fi
              echo "Waiting for apt/dpkg lock to be released (${waited}s)..."
              sleep 15
              waited=$((waited + 15))
            done
            if az extension add --name rdbms-connect && az postgres flexible-server execute --help > /dev/null 2>&1; then
              return 0
            fi
            echo "rdbms-connect install failed (attempt $attempt), retrying in 30s..."
            az extension remove --name rdbms-connect 2> /dev/null || true
            sleep 30
          done
          echo "Unable to install rdbms-connect extension"
          return 1
        }

        # Credentials come from env vars (see "env" below), never from inline macros:
        # macros are pasted into the script text, so bash would expand special chars ($, `, \) in passwords.
        create_user () {
          install_rdbms_connect || exit 1
          # escape single quotes for the SQL string literal
          PASS_SQL=${READ_USER_PASSWORD//\'/\'\'}
          az postgres flexible-server execute --name "${{ parameters.DB_HOST }}" --admin-user "$DB_ADMIN_LOGIN" \
          --admin-password "$DB_ADMIN_PASSWORD" --database-name "${{ parameters.DATABASE_NAME }}" \
          --querytext "
          do \$do\$
          BEGIN
          IF NOT EXISTS (SELECT FROM pg_catalog.pg_roles WHERE rolname = '$READ_USER_LOGIN') THEN
          CREATE ROLE $READ_USER_LOGIN WITH LOGIN PASSWORD '$PASS_SQL';
          ELSE
          -- keep the password aligned with the key vault on every run
          ALTER ROLE $READ_USER_LOGIN WITH LOGIN PASSWORD '$PASS_SQL';
          END IF;

          GRANT CONNECT ON DATABASE \"${{ parameters.DATABASE_NAME }}\" TO $READ_USER_LOGIN;

          GRANT pg_read_all_data TO $READ_USER_LOGIN;

          END
          \$do\$;
          "
        }

        create_user
    env:
      READ_USER_LOGIN: ${{ parameters.USERNAME }}
      READ_USER_PASSWORD: ${{ parameters.PASSWORD }}
      DB_ADMIN_LOGIN: $(${{ parameters.ADMIN_LOGIN_KEY }})
      DB_ADMIN_PASSWORD: $(${{ parameters.ADMIN_PWD_KEY }})
